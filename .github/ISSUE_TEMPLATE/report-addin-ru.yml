name: "Жалоба на аддин"
description: "Сообщите о проблеме с каталогом, пакетом или установкой аддина."
title: "[Жалоба на аддин] "
body:
  - type: markdown
    attributes:
      value: |
        После отправки жалоба станет публичной. Проверьте заполненные поля и уберите токены, персональные данные, локальные пути и необезличенные журналы. Для уязвимостей и конфиденциальных сведений используйте [инструкции по закрытой отправке](https://github.com/4FusionLab/CommunityStore/blob/main/SECURITY.ru.md).

        Например, неверная карточка, некорректный манифест, подозрительный ZIP или признаки подмены пакета. Об ошибках в работе стороннего аддина и пожеланиях к его функциям сообщайте его разработчику.
  - type: input
    id: repository
    attributes:
      label: "Репозиторий аддина на GitHub"
      description: "Публичный репозиторий в формате владелец/репозиторий, если известен."
  - type: input
    id: release-tag
    attributes:
      label: "Тег релиза GitHub"
      description: "Точный тег релиза, в котором возникла проблема, если известен."
  - type: input
    id: store-version
    attributes:
      label: "Версия Community Store"
  - type: textarea
    id: details
    attributes:
      label: "Что произошло?"
      description: "Опишите проблему, ожидаемый результат и, если возможно, шаги воспроизведения."
    validations:
      required: true
